name: Release
# Run it from the Actions tab after the version bump is pushed to `main`. It publishes the version in `pom.xml` and pushes its `v` tag.
on: workflow_dispatch
jobs:
  release:
    runs-on: ubuntu-latest
    # A release from any other branch would tag a commit that is not on `main`.
    if: github.ref == 'refs/heads/main'
    permissions:
      # For pushing the tag.
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
      # Maven Central has no trusted publishing, so the token and the signing key are secrets. The Bouncy Castle signer reads the key from `MAVEN_GPG_KEY`, so it needs no GnuPG.
      - run: mvn --batch-mode clean deploy -P release -Dgpg.signer=bc
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Tag
        run: |
          version="v$(yq --input-format xml --output-format yaml '.project.version' pom.xml)"
          git tag "$version"
          git push origin "$version"
